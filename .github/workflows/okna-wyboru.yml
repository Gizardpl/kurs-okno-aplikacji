# Zdjęcie systemowego okna wyboru folderu na macOS i Windows (to samo okno, które otwiera aplikacja desktopowa przy
# „Open folder…”). Tylko uruchomienie ręczne. Otwiera okno, robi zrzut i krótkie nagranie ekranu i kończy; bez sekretów,
# bez zapisu do repo. Wynik każdego kroku w wynik-<system>.json w artefakcie.
name: okna-wyboru

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zrzut:
    strategy:
      fail-fast: false
      matrix:
        system: [macos-latest, windows-2025]
    runs-on: ${{ matrix.system }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ciemny motyw systemu (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize -Name AppsUseLightTheme -Value 0 -Type Dword
          Set-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize -Name SystemUsesLightTheme -Value 0 -Type Dword
      - name: Nagrywanie ekranu (Windows, ffmpeg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Electron
        run: npm install --no-save --no-package-lock electron@45.2.3
      - name: Okno wyboru folderu, zrzut i nagranie
        env:
          OKNA_WYJSCIE: ${{ runner.temp }}/zrzuty
        run: npx --no-install electron okna-wyboru/main.js
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okno-wyboru-${{ runner.os }}
          path: ${{ runner.temp }}/zrzuty
          retention-days: 7
