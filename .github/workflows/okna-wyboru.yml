# Systemowe okno wyboru folderu na macOS i Windows (to samo okno, które otwiera aplikacja desktopowa przy „Open folder…”).
# Tylko uruchomienie ręczne. Zawsze najświeższy obraz systemu z tabeli actions/runner-images (także beta i preview);
# gdy przebieg na nim padnie, sam rusza poprzedni obraz. Bez sekretów, bez zapisu do repo. Opis kroków: okna-wyboru/main.js.
name: okna-wyboru

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obrazy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.wybor.outputs.mac }}
      mac_zapas: ${{ steps.wybor.outputs.mac_zapas }}
      win: ${{ steps.wybor.outputs.win }}
      win_zapas: ${{ steps.wybor.outputs.win_zapas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: wybor
        name: Najświeższe obrazy systemu
        shell: bash
        run: node obrazy/wybierz.js | tee -a "$GITHUB_STEP_SUMMARY"

  mac:
    needs: obrazy
    uses: ./.github/workflows/okna-wyboru-zrzut.yml
    with:
      obraz: ${{ needs.obrazy.outputs.mac }}

  mac-zapas:
    needs: [obrazy, mac]
    if: ${{ !cancelled() && needs.obrazy.result == 'success' && needs.mac.result != 'success' }}
    uses: ./.github/workflows/okna-wyboru-zrzut.yml
    with:
      obraz: ${{ needs.obrazy.outputs.mac_zapas }}

  win:
    needs: obrazy
    uses: ./.github/workflows/okna-wyboru-zrzut.yml
    with:
      obraz: ${{ needs.obrazy.outputs.win }}

  win-zapas:
    needs: [obrazy, win]
    if: ${{ !cancelled() && needs.obrazy.result == 'success' && needs.win.result != 'success' }}
    uses: ./.github/workflows/okna-wyboru-zrzut.yml
    with:
      obraz: ${{ needs.obrazy.outputs.win_zapas }}
